name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog (verified secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Pinned to a release older than 2 weeks (v3.99.2, 2026-10-08). Scans only the commits in the PR / push.
      - uses: trufflesecurity/trufflehog@v3.99.2
        with:
          extra_args: --only-verified
